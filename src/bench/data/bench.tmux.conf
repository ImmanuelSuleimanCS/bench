# Bench tmux configuration. Used only by Bench's private tmux server (tmux -S <bench socket> -f <this file>).
# It never affects any other tmux server. Proven in the Stage B spike on 20261010.

# Every pane starts a native arm64 login shell, even though tmux itself is an Intel build.
set -g default-command "arch -arm64 /bin/zsh -l"

# Prefix: Control+Space. Press it, release, then press the next key. Control+b is left to Claude Code.
set -g prefix C-Space
unbind C-b
bind C-Space send-prefix

# Terminal.app has no truecolor; this terminal type exists in macOS's own terminfo.
set -g default-terminal "screen-256color"

# Claude Code uses Escape a lot; a long escape delay makes it feel laggy.
set -sg escape-time 10
set -g focus-events on
set -g history-limit 50000

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g allow-rename off
setw -g automatic-rename off

# A pane whose program exits stays on screen, marked dead, until `bench cockpit restart`.
setw -g remain-on-exit on

# Resize each window to the most recently active client.
setw -g aggressive-resize on
set -g window-size latest

# Mouse: click to focus a pane, scroll history. Hold Option while dragging to select text in Terminal.app.
set -g mouse on

set -g pane-border-status top
set -g pane-border-format " #{@role} "

set -g status-left "[bench #S] "
set -g status-right " new line in Claude: Option+Enter "
set -g status-right-length 40
