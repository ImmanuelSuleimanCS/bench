[project]
name = "bench"
version = "0.3.1"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Immanuel Suleiman", email = "immanuelsuleimancs@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "textual==8.2.8",
]

[project.scripts]
bench = "bench:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["needs_tmux: runs against a real tmux server on a throwaway socket"]
